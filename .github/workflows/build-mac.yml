name: Build Wizard Mac App

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Code Checkout Karein
        uses: actions/checkout@v4

      - name: Python Setup Karein
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zaroori Libraries Install Karein
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Wizard Mac App (.app) Compile Karein
        run: |
          pyinstaller --noconfirm --onedir --name "WizardOnMac" wizard_on_mac.py
          cd dist
          zip -r WizardOnMac-macOS.zip WizardOnMac.app

      - name: Taiyar App ko Download ke liye Upload Karein
        uses: actions/upload-artifact@v4
        with:
          name: WizardOnMac-Download
          path: dist/WizardOnMac-macOS.zip
